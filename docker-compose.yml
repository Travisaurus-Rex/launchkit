services:
  postgres:
    image: postgres:17
    container_name: launchkit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: launchkit
      POSTGRES_USER: launchkit
      POSTGRES_PASSWORD: launchkit_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchkit -d launchkit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
